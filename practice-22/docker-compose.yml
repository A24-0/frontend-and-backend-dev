services:
  backend1:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm i && PORT=3000 node backend.js"
    volumes:
      - ./:/app

  backend2:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm i && PORT=3000 node backend.js"
    volumes:
      - ./:/app

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2

  haproxy:
    image: haproxy:2.9
    ports:
      - "8081:80"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - backend1
      - backend2
