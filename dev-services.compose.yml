services:
  postgres:
    image: postgres:16-alpine
    container_name: fbdev-postgres
    environment:
      POSTGRES_DB: frontend_backend_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - fbdev_postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: fbdev-mongo
    ports:
      - "27017:27017"
    volumes:
      - fbdev_mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: fbdev-redis
    ports:
      - "6379:6379"
    volumes:
      - fbdev_redis_data:/data

volumes:
  fbdev_postgres_data:
  fbdev_mongo_data:
  fbdev_redis_data:
